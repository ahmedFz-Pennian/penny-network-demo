<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penny Network Map</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#060a13;--panel:rgba(10,16,30,.76);--line:rgba(148,163,184,.14);--text:#e6edf7;--muted:#8b98ad;--accent:#5eead4;--accent2:#818cf8;--danger:#ff4d6d;--warn:#fbbf24;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;font-size:13px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#map{position:absolute;inset:0;z-index:0;background:#040710}
#map .leaflet-tile-pane,#map .leaflet-labels-pane{filter:sepia(.35) hue-rotate(182deg) saturate(2.3) brightness(.92) contrast(1.05)}
.fx{position:absolute;inset:0;z-index:1;pointer-events:none;background:
 radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(2,4,10,.78) 100%),
 linear-gradient(rgba(94,234,212,.035) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(90deg,rgba(94,234,212,.035) 1px,transparent 1px) 0 0/48px 48px}
.scan{position:absolute;left:0;right:0;height:180px;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(94,234,212,.05),transparent);animation:scan 7s linear infinite}
@keyframes scan{from{top:-180px}to{top:100%}}
.glass{position:absolute;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.topbar{top:14px;left:14px;right:14px;height:58px;display:flex;align-items:center;gap:16px;padding:0 18px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#041018;background:linear-gradient(135deg,#5eead4,#818cf8);box-shadow:0 0 24px rgba(94,234,212,.45)}
.logo b{display:block;font-size:15px}.logo span{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.sep{width:1px;height:28px;background:var(--line)}
.client{color:var(--muted)}.client b{color:var(--text)}
.grow{flex:1}
.live{display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.clock{font-size:14px;color:#cfe9ff}
.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid rgba(251,191,36,.4);color:var(--warn);white-space:nowrap}
.badge.g{border-color:rgba(52,211,153,.4);color:var(--ok)}
.left{top:84px;left:14px;bottom:64px;width:318px;padding:16px;overflow:auto}
.right{top:84px;right:14px;bottom:64px;width:384px;padding:18px;overflow:auto}
.left::-webkit-scrollbar,.right::-webkit-scrollbar{width:6px}.left::-webkit-scrollbar-thumb,.right::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:9px}
h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
h4:first-child{margin-top:0}
.cnt{background:rgba(255,77,109,.15);color:var(--danger);border-radius:999px;padding:1px 7px;letter-spacing:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:10px 11px;border-radius:12px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid var(--line);position:relative;overflow:hidden}
.kpi .l{font-size:10.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;background:linear-gradient(90deg,#fff,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.warn .v{background:linear-gradient(90deg,#fff,#fcd34d);-webkit-background-clip:text;background-clip:text}
.kpi.bad .v{background:linear-gradient(90deg,#fff,#fda4af);-webkit-background-clip:text;background-clip:text}
.kpi .s{font-size:10px;color:var(--muted)}
.kpi svg{position:absolute;right:6px;top:10px;width:56px;height:20px;opacity:.8}
.sys{display:grid;gap:6px}
.sy{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);font-size:11.5px;background:rgba(255,255,255,.02)}
.sy i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.sy b{font-weight:600}.sy span{color:var(--muted);font-size:10.5px;margin-left:auto;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;user-select:none;transition:.2s;font-size:12px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chip small{color:var(--muted)}
.chip.off{opacity:.35}.chip:hover{border-color:rgba(255,255,255,.3)}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lay{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:11.5px;user-select:none;transition:.2s}
.lay .sw{width:24px;height:14px;border-radius:9px;background:rgba(148,163,184,.25);position:relative;flex:none;transition:.2s}
.lay .sw:after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#cbd5e1;transition:.2s}
.lay.on{border-color:rgba(94,234,212,.35);background:rgba(94,234,212,.06)}
.lay.on .sw{background:linear-gradient(90deg,#5eead4,#818cf8)}.lay.on .sw:after{left:12px;background:#fff}
.scen{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:12px;border:1px solid var(--line);cursor:pointer;margin-bottom:7px;transition:.2s;background:rgba(255,255,255,.02)}
.scen:hover{border-color:rgba(129,140,248,.5);transform:translateX(2px)}
.scen.active{border-color:rgba(94,234,212,.6);background:linear-gradient(90deg,rgba(94,234,212,.12),rgba(129,140,248,.06));box-shadow:0 0 24px rgba(94,234,212,.12)}
.scen .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(129,140,248,.14);color:#c7d2fe}
.scen.active .ic{background:linear-gradient(135deg,#5eead4,#818cf8);color:#041018}
.ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scen b{display:block;font-size:12.5px}.scen span{font-size:11px;color:var(--muted)}
.reset{margin-top:4px;font-size:11.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}.reset:hover{color:var(--text)}
.reset svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.right h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:4px 0 3px;line-height:1.3}
.sub{color:var(--muted);font-size:12px}
.ph{display:flex;gap:12px;align-items:flex-start}
.ph .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);margin-top:6px;flex:none}
.row3{display:flex;gap:10px;align-items:center;margin-top:14px}
.stat{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.stat span{display:block;font-size:10.5px;color:var(--muted)}.stat b{font-size:16px}
.ring{--p:80;--c:var(--ok);width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.07) 0);display:grid;place-items:center;position:relative;flex:none}
.ring:before{content:'';position:absolute;inset:7px;border-radius:50%;background:#0a1222}
.ring div{position:relative;text-align:center}.ring b{font-size:21px;display:block;line-height:1}.ring span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ring.big{width:104px;height:104px}.ring.big b{font-size:28px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background:rgba(255,255,255,.02)}
.li b{display:block;font-size:12px;font-weight:600}.li span{font-size:11px;color:var(--muted)}
.li.click{cursor:pointer;transition:.15s}.li.click:hover{border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.05)}
.li .l2{display:flex;gap:9px;align-items:center;min-width:0}.li .l2>div{min-width:0}
.bul{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{color:var(--ok);background:rgba(52,211,153,.12)}.tag.warn{color:var(--warn);background:rgba(251,191,36,.13)}.tag.bad{color:var(--danger);background:rgba(255,77,109,.14)}
.tag.info{color:#c7d2fe;background:rgba(129,140,248,.15)}
.prog{margin-bottom:11px}
.pl{display:flex;align-items:center;gap:7px;font-size:12px}.pl b{margin-left:auto}
.pl span.m{color:var(--muted);font-size:11px}
.swt{width:8px;height:8px;border-radius:2px;flex:none}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);margin:6px 0 4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;box-shadow:0 0 12px currentColor;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.bar.rp{overflow:visible}.bar.rp em{position:absolute;left:25%;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.55;border-radius:2px}
@keyframes grow{from{width:0!important}}
.pn{font-size:10.5px;color:var(--muted)}
.card{padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(94,234,212,.07),rgba(129,140,248,.04));margin-top:12px;font-size:12px;line-height:1.55}
.card .ct{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card.ok{background:linear-gradient(160deg,rgba(52,211,153,.14),rgba(52,211,153,.03));border-color:rgba(52,211,153,.35)}
.card.bad{background:linear-gradient(160deg,rgba(255,77,109,.12),rgba(255,77,109,.02));border-color:rgba(255,77,109,.35)}
.card .nums{display:flex;gap:14px;margin-top:6px}.card .nums div{font-size:11px;color:var(--muted)}.card .nums b{display:block;font-size:16px;color:var(--text)}
.btn{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:0;cursor:pointer;font:600 12.5px Inter,sans-serif;color:#041018;background:linear-gradient(90deg,#5eead4,#818cf8);box-shadow:0 8px 30px rgba(94,234,212,.25);transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.sm{width:auto;padding:7px 12px;margin-top:8px;font-size:11.5px}
.steps{margin-top:12px;position:relative;padding-left:18px}
.steps:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--accent2))}
.step{position:relative;margin-bottom:10px;font-size:12px}.step:before{content:'';position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:#0a1222;border:2px solid var(--accent)}
.step span{display:block;color:var(--muted);font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font:500 11.5px Inter,sans-serif;cursor:pointer}
.seg button.on{border-color:rgba(94,234,212,.6);background:rgba(94,234,212,.12)}
.ticker{left:14px;right:14px;bottom:14px;height:38px;display:flex;align-items:center;overflow:hidden;border-radius:12px}
.tk-label{flex:none;padding:0 14px;height:100%;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border-right:1px solid var(--line)}
.tk-track{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tk{display:inline-flex;white-space:nowrap;animation:marq 80s linear infinite}
#tk span{padding:0 26px;color:#b6c2d6;font-size:12px;border-right:1px solid var(--line)}
#tk b{color:#fff;font-weight:600}#tk b.r{color:var(--danger)}#tk b.a{color:var(--warn)}#tk b.g{color:var(--ok)}
@keyframes marq{to{transform:translateX(-50%)}}
#toast{position:absolute;z-index:20;left:50%;top:86px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:12px;background:rgba(10,18,34,.95);border:1px solid rgba(94,234,212,.4);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(94,234,212,.15);transition:.35s cubic-bezier(.2,.8,.2,1);font-size:12.5px}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* phone mock */
.phone{position:absolute;z-index:12;right:414px;bottom:70px;width:252px;height:528px;border-radius:38px;padding:10px;background:linear-gradient(160deg,#1e293b,#0b1220);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(94,234,212,.14);opacity:0;transform:translateY(30px) scale(.96);pointer-events:none;transition:.45s cubic-bezier(.2,.8,.2,1)}
.phone.show{opacity:1;transform:none;pointer-events:auto}
.ph-cap{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:78px;height:20px;border-radius:12px;background:#0b1220;z-index:2}
.scr{height:100%;border-radius:30px;background:#f8fafc;color:#0f172a;overflow:hidden;display:flex;flex-direction:column;font-family:Inter,sans-serif}
.ph-top{padding:40px 16px 14px;background:linear-gradient(135deg,#0f766e,#4338ca);color:#fff}
.ph-top b{display:block;font-size:17px}.ph-top small{opacity:.85;font-size:12px}
.ph-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:11px}
.ph-item{display:flex;gap:10px;align-items:center}
.ph-ic{width:50px;height:50px;border-radius:14px;background:#fef3c7;display:grid;place-items:center;flex:none}
.ph-ic svg{width:28px;height:28px;stroke:#b45309;fill:none;stroke-width:1.8;stroke-linejoin:round}
.ph-item b{display:block;font-size:16px}.ph-item span{font-size:12px;color:#b45309;font-weight:600}
.ph-bar{height:10px;border-radius:9px;background:#e2e8f0;position:relative}
.ph-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#ef4444,#f59e0b)}
.ph-bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#0f172a;left:25%}
.ph-qty{display:flex;align-items:center;justify-content:space-between;background:#f1f5f9;border-radius:16px;padding:8px}
.ph-qty button{width:44px;height:44px;border-radius:12px;border:0;background:#fff;font-size:22px;font-weight:700;color:#0f172a;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer}
.ph-qty div{text-align:center}.ph-qty b{font-size:28px;display:block;line-height:1.1}.ph-qty small{font-size:11px;color:#64748b}
.ph-sup{font-size:12px;color:#334155;line-height:1.75;background:#f1f5f9;border-radius:12px;padding:9px 11px}
.ph-btn{margin-top:auto;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font:700 17px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(16,185,129,.35)}
.ph-note{font-size:10.5px;color:#64748b;text-align:center}
.ph-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.ph-done .okc{width:74px;height:74px;border-radius:50%;background:#d1fae5;display:grid;place-items:center;animation:pop2 .5s cubic-bezier(.2,1.6,.4,1)}
.ph-done svg{width:40px;height:40px;stroke:#059669;stroke-width:3;fill:none}
.ph-done b{font-size:18px}.ph-done span{font-size:12px;color:#64748b}
@keyframes pop2{from{transform:scale(.3)}}
/* map objects */
path.store{transition:opacity .4s}
path.pop{animation:fadein .7s both}
@keyframes fadein{from{opacity:0}}
#map.dim path.store{opacity:.1}
#map.dim path.store.hl{opacity:1}
#map.dim .terr{opacity:.25}
path.flow{stroke-dasharray:3 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.pulse{border-radius:50%;position:relative}
.pulse:before,.pulse:after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ring 2s ease-out infinite}
.pulse:after{animation-delay:1s}
@keyframes ring{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
.truck{width:100%;height:100%;border-radius:50%;background:var(--c);box-shadow:0 0 6px 2px var(--c),0 0 18px 4px color-mix(in srgb,var(--c) 45%,transparent)}
.truck.cold{animation:coldblink .8s steps(2) infinite}
@keyframes coldblink{50%{opacity:.35}}
.selr{width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 0 16px #fff}
.dc{position:relative;width:34px;height:34px}
.dc-ring{position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed rgba(94,234,212,.7);animation:spin 9s linear infinite}
.dc-core{position:absolute;inset:4px;border-radius:9px;transform:rotate(45deg);background:linear-gradient(135deg,#5eead4,#818cf8);box-shadow:0 0 22px rgba(94,234,212,.7)}
.dc-t{position:absolute;inset:0;display:grid;place-items:center;font:800 9px Inter;color:#041018}
.dc-label{position:absolute;left:44px;top:2px;white-space:nowrap;font-size:12.5px;font-weight:700;color:#e6fffb;text-shadow:0 0 8px #000,0 0 3px #000}
.dc-label small{display:block;font:600 9.5px Inter;color:#94a3b8;letter-spacing:.06em}
@keyframes spin{to{transform:rotate(360deg)}}
.sup{width:12px;height:12px;transform:rotate(45deg);background:var(--c);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 0 12px var(--c)}
.heat{border-radius:50%;background:radial-gradient(circle,rgba(255,140,60,.6),rgba(255,60,110,.22) 38%,transparent 70%);mix-blend-mode:screen}
.newsite{width:100%;height:100%;border-radius:50%;border:3px solid #c4b5fd;background:rgba(196,181,253,.15);box-shadow:0 0 16px #a78bfa}
.money{white-space:nowrap;padding:6px 10px;border-radius:10px;background:rgba(10,16,30,.88);border:1px solid rgba(251,191,36,.55);color:#fde68a;font:700 12.5px Inter;box-shadow:0 0 22px rgba(251,191,36,.28);transform:translate(-50%,-50%);display:inline-block;animation:fadein .6s both;text-align:center}
.money small{display:block;color:#cbd5e1;font-weight:500;font-size:10px}
.money.bad{border-color:rgba(255,77,109,.6);color:#fecdd3;box-shadow:0 0 22px rgba(255,77,109,.3)}
.money.ok{border-color:rgba(52,211,153,.5);color:#bbf7d0;box-shadow:0 0 22px rgba(52,211,153,.2)}
.leaflet-tooltip.tt{background:rgba(8,14,27,.94);color:var(--text);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.4);font:500 12px Inter,sans-serif;padding:7px 10px}
.leaflet-tooltip.tt span{color:var(--muted);font-size:11px}
.leaflet-tooltip-top.tt:before{border-top-color:rgba(8,14,27,.94)}
.leaflet-tooltip.terr-label{background:transparent;border:0;box-shadow:none;color:#fff;font:700 12.5px Inter,sans-serif;text-align:center;text-shadow:0 0 10px #000,0 0 4px #000;opacity:.85!important;line-height:1.35}
.leaflet-tooltip.terr-label small{display:block;font:600 10px Inter,sans-serif;letter-spacing:.08em;color:#cbd5e1;text-transform:uppercase}
.terr-label:before{display:none}
#map.dim .terr-label{opacity:.2!important}
#map.hide-terr .terr-label{display:none}

 const reg=RK[ct.r],lic=LK[reg.lic],[den]=pick(ct.d),key=ct.en+den;num[key]=(num[key]||0)+1;

 const qty=Math.max(1,Math.round((.8-x.pct/100)*x.it.cap)),v=SK[x.it.sup],pr=PRICES[x.it.k];
 phoneState={s,x,qty,v};
 $('#scr').innerHTML=`<div class="ph-top"><b>${s.en}</b><small>Suggested order · ${s.lic.en}</small></div>
 <div class="ph-body"><div class="ph-item"><div class="ph-ic">${x.it.k==='uni'?SHIRT:BOX}</div><div><b>${x.it.en}</b><span>${x.qty} ${x.it.unit} left · below reorder point</span></div></div>
 <div class="ph-bar"><i style="width:${x.pct}%"></i><em></em></div>
 <div class="ph-qty"><button onclick="phoneQty(-1)">−</button><div><b id="pq">${qty}</b><small>suggested quantity</small></div><button onclick="phoneQty(1)">+</button></div>
 <div class="ph-sup">Approved supplier: <b>${v.en}</b><br>${pr?`Agreed price: SAR ${pr.p[s.lic.id]}`:'Price as per contract'} · delivery in 3 days</div>
 <button class="ph-btn" onclick="phoneApprove()">Approve</button><div class="ph-note">Creates the PO in Penny and sends it to Dynamics</div></div>`;
 $('#phone').classList.add('show')}
function phoneQty(d){phoneState.qty=Math.max(1,phoneState.qty+d*(phoneState.x.it.cap>=100?10:1));$('#pq').textContent=phoneState.qty}
function phoneApprove(){const p=phoneState,po='PO-'+(88200+p.s.id);
 $('#scr').innerHTML=`<div class="ph-top"><b>${p.s.en}</b><small>Suggested order</small></div><div class="ph-done"><div class="okc"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><b>Order sent</b><span>${p.qty} ${p.x.it.unit} · ${p.v.en}</span><span class="mono">${po}</span></div>`;
 toast(`${po} created in Penny · synced to Dynamics 365 · ${p.v.en} notified`);
 const pts=arc(p.v.c,p.s.c,.2,50);line(pts,'#34d399',LY.scen,{w:2.4});addMover(pts,{color:'#34d399',speed:.25,layer:LY.scen,size:11})}
function reorder(s){
 clearScenario();setActive('reorder');
 const low=[];stores.forEach(st=>st.low.forEach(x=>low.push({s:st,x})));low.sort((a,b)=>a.x.pct-b.x.pct);
 hl(lowStores);lowStores.forEach(x=>pulse(x.c,'#fbbf24',30));
 const focus=s?{s,x:s.stock.slice().sort((a,b)=>a.pct-b.pct)[0]}:{s:demoLow,x:demoLow.stock[5]};
 selRing(focus.s.c);
 const pb=innerWidth>1300?{...pad(),paddingBottomRight:[690,66]}:pad();
 if(s)map.flyTo(s.c,11,{duration:1.1});else map.flyToBounds(L.latLngBounds(lowStores.map(x=>x.c)),{...pb,duration:1.2});
 later(()=>showPhone(focus.s,focus.x),700);
 panel.innerHTML=`<div class="eyebrow" style="color:var(--warn)">Low stock · suggested orders</div><h2>${low.length} items below reorder point</h2><div class="sub">across ${lowStores.length} restaurants · reorder point is 25% of par, set per item</div>
 <div class="card"><div class="ct">How it works</div>Penny watches stock against each restaurant's sales history. When an item drops under the reorder point it <b>suggests</b> an order from the BFS-approved supplier at the contract price. The manager approves with one tap. Nothing is ordered automatically.</div>
 <h4>Lowest first</h4>${low.slice(0,24).map(r=>`<div class="li click" onclick="reorder(stores[${r.s.id}])"><div class="l2"><span class="bul" style="--c:${r.s.lic.color}"></span><div><b>${r.x.it.en} <span>· ${r.x.qty} ${r.x.it.unit} left</span></b><span>${r.s.en} · ${r.s.city.en}</span></div></div><span class="tag ${r.x.pct<15?'bad':'warn'}">${r.x.pct}%</span></div>`).join('')}`}

function abnormal(){
 clearScenario();setActive('abn');hl(ABN.map(a=>a.s));
 ABN.forEach((a,i)=>later(()=>{pulse(a.s.c,'#ff4d6d',58);const v=SK[IK[a.it].sup];line(arc(v.c,a.s.c,.2,50),'#ff4d6d',LY.scen,{w:1.8})},i*300));
 map.flyToBounds(L.latLngBounds(ABN.flatMap(a=>[a.s.c,SK[IK[a.it].sup].c])),{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow" style="color:var(--danger)">Abnormal orders</div><h2>${ABN.length} orders need a second look</h2><div class="sub">Every order is checked against POS sales, stock on hand and what's already in transit</div>
 ${ABN.map(a=>`<div class="card bad"><div class="ct">${a.t}</div><b>${a.s.en}</b> · ${a.s.lic.en}<br>${a.d}<div class="nums">${a.type==='dup'?'<div><b>20</b>on hand</div><div><b>100</b>in transit</div><div><b>100</b>ordered</div>':a.type==='resale'?'<div><b>42</b>tins bought</div><div><b>~15</b>POS supports</div><div><b>2.7×</b>ratio</div>':'<div><b>+64%</b>vs average</div><div><b>0%</b>sales change</div><div><b>3</b>days</div>'}</div><button class="btn sm" onclick="selectStore(stores[${a.s.id}])">${a.act} · open restaurant</button></div>`).join('')}`}

function priceGov(k){
 clearScenario();setActive('price');mapEl.classList.add('hide-terr');const p=PRICES[k],v=SK[p.sup],it=IK[k];
 REG.forEach(r=>{const l=LK[r.lic],vv=(p.p[l.id]-p.rec)/p.rec*100,col=vv>5?'#ff4d6d':vv>2?'#fbbf24':'#34d399';
  L.polygon(r.poly,{color:col,weight:2,opacity:.9,fillColor:col,fillOpacity:.16,interactive:false}).addTo(LY.scen);
  label(r.center,`SAR ${p.p[l.id]}<small>${vv>0?'+':''}${vv.toFixed(1)}% · ${l.en}</small>`,vv>5?'bad':vv>2?'':'ok');
  later(()=>line(arc(v.c,r.center,.2,50),col,LY.scen,{w:1.4,op:.7}),300)});
 pulse(v.c,'#fbbf24',50);map.flyToBounds(allBounds,{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow">Price governance</div><h2>${it.en}</h2><div class="sub">${v.en} · BFS recommended price SAR ${p.rec} ${p.unit}</div>
 <div class="seg">${Object.keys(PRICES).map(x=>`<button class="${x===k?'on':''}" onclick="priceGov('${x}')">${IK[x].en.replace(' 18 L','').replace('Staff ','').replace('Packaging ','')}</button>`).join('')}</div>
 <h4>What each licensee pays</h4>${LIC.map(l=>{const vv=(p.p[l.id]-p.rec)/p.rec*100;return `<div class="prog"><div class="pl"><span class="swt" style="background:${l.color}"></span>${l.en}<b>SAR ${p.p[l.id]}</b></div><div class="bar"><i style="width:${Math.min(100,p.p[l.id]/(p.rec*1.12)*100)}%;background:${vv>5?'#ff4d6d':vv>2?'#fbbf24':'#34d399'};color:${vv>5?'#ff4d6d':'#34d399'}"></i></div><div class="pn">${vv>0?'+':''}${vv.toFixed(1)}% vs recommended</div></div>`}).join('')}
 <div class="card"><div class="ct">Why this matters</div>Licensees can renegotiate with suppliers, which is fine. What BFS couldn't see was <b>one supplier charging different licensees different prices</b> for the same line. Penny tracks every line price on every PO.</div>
 <button class="btn" onclick="toast('Price alignment request sent to ${v.en} · licensees copied')">Ask the supplier to align prices</button>`}

function royalties(){
 clearScenario();setActive('roy');mapEl.classList.add('hide-terr');map.flyToBounds(allBounds,{...pad(),duration:1.2});
 const ST=['Paid','Paid','Issued','Issued'];
 const rows=LIC.map((l,i)=>{const net=l.stores.reduce((a,s)=>a+s.sales*31*.93,0);return{l,net,roy:net*RATE/100,st:ST[i]}});
 const tot=rows.reduce((a,r)=>a+r.roy,0),max=Math.max(...rows.map(r=>r.roy));
 rows.forEach((r,i)=>r.l.regions.forEach((g,j)=>later(()=>{pulse(g.center,'#fbbf24',70);label(g.center,`SAR ${fmt(r.roy*g.n/r.l.n)}<small>${g.en} · ${r.st}</small>`)},(i*2+j)*220)));
 panel.innerHTML=`<div class="eyebrow">Royalty invoices · August 2026</div><h2>SAR ${fmt(tot)} invoiced to ${LIC.length} licensees</h2><div class="sub">Same rate for every licensee (${RATE}%, demo figure) · calculated in Dynamics, shown here</div>
 <h4>Daily pipeline</h4><div class="steps"><div class="step">POS day close · 02:45<span>${stores.length} restaurants</span></div><div class="step">Push to Azure · 11:00<span>automatic batch job</span></div><div class="step">Dynamics 365 calculates<span>royalty per licensee, per month</span></div><div class="step">Invoice issued<span>no manual calculation</span></div></div>
 <h4>By licensee</h4>${rows.map(r=>`<div class="prog"><div class="pl"><span class="swt" style="background:${r.l.color}"></span>${r.l.en}<b>SAR ${fmt(r.roy)}</b></div><div class="bar"><i style="width:${r.roy/max*100}%;background:${r.l.color};color:${r.l.color}"></i></div><div class="pn">${r.l.n} restaurants · net sales SAR ${fmt(r.net)} · <span style="color:${r.st==='Paid'?'var(--ok)':'var(--warn)'}">${r.st}</span></div></div>`).join('')}
 <div class="card"><div class="ct">What Penny adds</div>The licensee sees the same numbers BFS sees, down to restaurant and day. The ${PREOPEN.length} pre-opening sites are excluded until they actually open.</div>`}

function contracts(){
 clearScenario();setActive('ctr');
 const ex=CONTRACTS.filter(c=>c.d<60).sort((a,b)=>a.d-b.d);
 ex.forEach((c,i)=>later(()=>{pulse(c.v.c,c.d<30?'#ff4d6d':'#fbbf24',44);c.l.regions.forEach(r=>line(arc(c.v.c,r.center,.2,50),c.d<30?'#ff4d6d':'#fbbf24',LY.scen,{w:1.3,op:.7}))},i*200));
 map.flyToBounds(allBounds,{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow" style="color:var(--warn)">Contract renewals</div><h2>${ex.length} supply contracts expire in 60 days</h2><div class="sub">Direct supply terms: price, delivery window and payment terms agreed in advance</div>
 <h4>Soonest first</h4>${ex.map(c=>`<div class="li"><div class="l2"><span class="bul" style="--c:${c.l.color}"></span><div><b>${c.v.en} × ${c.l.en}</b><span>${c.basis} · ${c.win} · ${c.pay}</span></div></div>${tag(c.d)}</div>`).join('')}
 <button class="btn" onclick="toast('${ex.length} renewals routed to Legal (CLM) with the current terms attached')">Route ${ex.length} renewals to Legal</button>
 <div class="card"><div class="ct">Next step: framework agreements</div>No MFAs are active today. When BFS introduces them, each can carry a spend cap by quantity or by price, and Penny stops orders that would breach it.</div>`}

function preopen(){
 clearScenario();setActive('pre');
 PREOPEN.forEach((p,i)=>later(()=>{const w=WH.reduce((a,x)=>km(x.c,p.c)<km(a.c,p.c)?x:a);
  L.marker(p.c,{icon:L.divIcon({className:'',html:'<div class="newsite"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(LY.scen);
  pulse(p.c,p.slip?'#fbbf24':'#c4b5fd',56);line(arc(w.c,p.c,.2,40),'#c4b5fd',LY.scen,{w:1.2,op:.6})},i*250));
 map.flyToBounds(L.latLngBounds(PREOPEN.map(p=>p.c)),{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow">Pre-opening sites</div><h2>${PREOPEN.length} restaurants getting ready to open</h2><div class="sub">Handled by the licensee's engineering team and consultants</div>
 <h4>Sites</h4>${PREOPEN.map(p=>`<div class="li"><div class="l2"><span class="bul" style="--c:${LK[p.lic].color}"></span><div><b>${p.en} <span>· ${p.city}</span></b><span>${p.st} · ${p.why}</span></div></div><span class="tag ${p.slip?'warn':'ok'}">${p.slip?p.exp+' → '+p.now:p.now}</span></div>`).join('')}
 <div class="card"><div class="ct">How delays are handled</div>Openings slip for real reasons: pipes, air conditioning, cold rooms. Penny tracks the dates and reasons for BFS without penalties, and royalty starts from the actual opening date.</div>
 <div class="card"><div class="ct">Before launch</div>When a site is ready, the supply chain team confirms the date and Penny notifies every approved supplier so the first delivery arrives on time.</div>`}

function flyTruck(id){clearScenario();setActive(null);const t=inTransit.find(x=>x.id===id),p=t.mv.m.getLatLng();map.flyTo(p,9,{duration:1.2});
 panel.innerHTML=`<div class="eyebrow" style="color:var(--danger)">Cold chain</div><h2>Truck ${t.id} at ${t.temp.toFixed(1)}°C</h2><div class="sub">${t.car.en} · ${t.s.wh.en} → ${t.s.en}</div>
 <div class="grid2"><div class="stat"><span>Limit</span><b>5.0°C</b></div><div class="stat"><span>Above limit for</span><b style="color:var(--danger)">${RI(14,40)} min</b></div></div>
 <div class="card"><div class="ct">Automatic action</div>Receipt at the restaurant is on hold. The manager sees a warning on the receiving screen and records a temperature before accepting.</div>`}

home();
</script>
</body>
</html>
