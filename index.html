<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#F4F5F7;--panel:#FFFFFF;--line:#E4E7EB;--text:#0B0D12;--muted:#6B7280;--accent:#242933;--yellow:#FFCA1A;--yellow-d:#E5B100;--yellow-l:#FFF9E5;--red:#CF3A35;--danger:#B20004;--warn:#CC7E00;--ok:#006626;--info:#0052CC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Figtree,Inter,system-ui,sans-serif;overflow:hidden;font-size:13px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#map{position:absolute;inset:0;z-index:0;background:#EDEFF2}
.glass{position:absolute;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06)}
.topbar{top:14px;left:14px;right:14px;height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#000;border-color:#000;color:#fff;overflow:hidden}
.topbar:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--red) 50% 100%)}
.logo{display:flex;align-items:center;gap:10px}
.brandlogo{height:22px;width:auto;display:block}
.prod{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}

.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#000;background:var(--yellow)}
.logo b{display:block;font-size:15px;color:#fff}.logo span{font-size:10.5px;color:#9CA3AF;letter-spacing:.12em;text-transform:uppercase}
.sep{width:1px;height:28px;background:rgba(255,255,255,.18)}
.client{color:#9CA3AF;display:flex;align-items:center;gap:6px}.client b{color:#fff}
.cb{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.grow{flex:1}
.live{display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.16em;color:#4ADE80}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.clock{font-size:14px;color:#fff}
.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,202,26,.6);color:var(--yellow);white-space:nowrap}
.badge.g{border-color:rgba(74,222,128,.5);color:#4ADE80}
.left{top:84px;left:14px;bottom:64px;width:318px;padding:16px;overflow:auto}
.right{top:84px;right:14px;bottom:64px;width:384px;padding:18px;overflow:auto}
.left::-webkit-scrollbar,.right::-webkit-scrollbar{width:6px}.left::-webkit-scrollbar-thumb,.right::-webkit-scrollbar-thumb{background:#D2D5D9;border-radius:9px}
h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px;font-weight:700;display:flex;align-items:center;gap:8px}
h4:first-child{margin-top:0}
.cnt{background:#FFE5E6;color:var(--danger);border-radius:999px;padding:1px 7px;letter-spacing:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:10px 11px;border-radius:10px;background:#F7F8FA;border:1px solid var(--line);position:relative;overflow:hidden}
.kpi .l{font-size:10.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:2px;color:#000}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--danger)}
.kpi .s{font-size:10px;color:var(--muted)}
.kpi svg{position:absolute;right:6px;top:10px;width:56px;height:20px;opacity:.9}
.sys{display:grid;gap:6px}
.sy{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);font-size:11.5px;background:#F7F8FA}
.sy i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.sy b{font-weight:700}.sy span{color:var(--muted);font-size:10.5px;margin-left:auto;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none;transition:.15s;font-size:12px;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip small{color:var(--muted);font-weight:500}
.chip.off{opacity:.35}.chip:hover{border-color:#000}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lay{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-size:11.5px;user-select:none;transition:.15s;background:#fff}
.lay .sw{width:24px;height:14px;border-radius:9px;background:#D2D5D9;position:relative;flex:none;transition:.15s}
.lay .sw:after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.15s}
.lay.on{border-color:var(--yellow-d);background:var(--yellow-l)}
.lay.on .sw{background:#000}.lay.on .sw:after{left:12px}
.scen{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:10px;border:1px solid var(--line);cursor:pointer;margin-bottom:7px;transition:.15s;background:#fff}
.scen:hover{border-color:#000}
.scen.active{border-color:#000;background:var(--yellow-l);box-shadow:inset 4px 0 0 var(--yellow)}
.scen .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:#F2F3F5;color:#242933}
.scen.active .ic{background:var(--yellow);color:#000}
.ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scen b{display:block;font-size:12.5px}.scen span{font-size:11px;color:var(--muted)}
.reset{margin-top:4px;font-size:11.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}.reset:hover{color:#000}
.reset svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.right h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:4px 0 3px;line-height:1.3;color:#000}
.sub{color:var(--muted);font-size:12px}
.ph{display:flex;gap:12px;align-items:flex-start}
.ph .dot{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.row3{display:flex;gap:10px;align-items:center;margin-top:14px}
.stat{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#F7F8FA}
.stat span{display:block;font-size:10.5px;color:var(--muted)}.stat b{font-size:16px}
.ring{--p:80;--c:var(--ok);width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#EDEFF2 0);display:grid;place-items:center;position:relative;flex:none}
.ring:before{content:'';position:absolute;inset:7px;border-radius:50%;background:#fff}
.ring div{position:relative;text-align:center}.ring b{font-size:21px;display:block;line-height:1}.ring span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ring.big{width:104px;height:104px}.ring.big b{font-size:28px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px;background:#fff}
.li b{display:block;font-size:12px;font-weight:700}.li span{font-size:11px;color:var(--muted)}
.li.click{cursor:pointer;transition:.15s}.li.click:hover{border-color:#000;background:#FAFAFB}
.li .l2{display:flex;gap:9px;align-items:center;min-width:0}.li .l2>div{min-width:0}
.bul{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{color:var(--ok);background:#EDFAF2}.tag.warn{color:#A66600;background:#FFF3DB}.tag.bad{color:var(--danger);background:#FFE5E6}
.tag.info{color:var(--info);background:#EDF4FE}
.prog{margin-bottom:11px}
.pl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}.pl b{margin-left:auto}
.pl span.m{color:var(--muted);font-size:11px;font-weight:500}
.swt{width:8px;height:8px;border-radius:2px;flex:none}
.bar{height:6px;border-radius:9px;background:#EDEFF2;margin:6px 0 4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.bar.rp{overflow:visible}.bar.rp em{position:absolute;left:25%;top:-3px;bottom:-3px;width:2px;background:#000;opacity:.6;border-radius:2px}
@keyframes grow{from{width:0!important}}
.pn{font-size:10.5px;color:var(--muted)}
.card{padding:12px;border-radius:10px;border:1px solid var(--line);background:#F7F8FA;margin-top:12px;font-size:12px;line-height:1.55}
.card .ct{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:700}
.card.ok{background:#EDFAF2;border-color:#D8F0E0}
.card.bad{background:#FFF5F5;border-color:#FAD4D5}
.card .nums{display:flex;gap:14px;margin-top:6px}.card .nums div{font-size:11px;color:var(--muted)}.card .nums b{display:block;font-size:16px;color:#000}
.btn{margin-top:14px;width:100%;padding:11px;border-radius:10px;border:0;cursor:pointer;font:700 12.5px Figtree,Inter,sans-serif;color:#000;background:var(--yellow);transition:.15s}
.btn:hover{background:var(--yellow-d)}
.btn.sm{width:auto;padding:7px 12px;margin-top:8px;font-size:11.5px;background:#000;color:#fff}.btn.sm:hover{background:#242933}
.steps{margin-top:12px;position:relative;padding-left:18px}
.steps:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#D2D5D9}
.step{position:relative;margin-bottom:10px;font-size:12px;font-weight:600}.step:before{content:'';position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid #000}
.step span{display:block;color:var(--muted);font-size:11px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#000;font:600 11.5px Figtree,Inter,sans-serif;cursor:pointer}
.seg button.on{border-color:#000;background:#000;color:#fff}
.ticker{left:14px;right:14px;bottom:14px;height:38px;display:flex;align-items:center;overflow:hidden;border-radius:12px}
.tk-label{flex:none;padding:0 14px;height:100%;display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#000;border-right:1px solid var(--line);background:var(--yellow)}
.tk-label .live{color:#000}
.tk-track{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tk{display:inline-flex;white-space:nowrap;animation:marq 80s linear infinite}
#tk span{padding:0 26px;color:#374151;font-size:12px;border-right:1px solid var(--line)}
#tk b{color:#000;font-weight:700}#tk b.r{color:var(--danger)}#tk b.a{color:var(--warn)}#tk b.g{color:var(--ok)}
@keyframes marq{to{transform:translateX(-50%)}}
#toast{position:absolute;z-index:20;left:50%;top:86px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:10px;background:#000;color:#fff;border-left:4px solid var(--yellow);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.35s cubic-bezier(.2,.8,.2,1);font-size:12.5px;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* phone mock: the restaurant app, themed in the customer's brand */
.phone{position:absolute;z-index:12;right:414px;bottom:70px;width:252px;height:528px;border-radius:38px;padding:10px;background:#111;border:1px solid #000;box-shadow:0 24px 60px rgba(0,0,0,.35);opacity:0;transform:translateY(30px) scale(.96);pointer-events:none;transition:.45s cubic-bezier(.2,.8,.2,1)}
.phone.show{opacity:1;transform:none;pointer-events:auto}
.ph-cap{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#000;text-shadow:0 0 4px #fff,0 0 8px #fff}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:78px;height:20px;border-radius:12px;background:#111;z-index:2}
.scr{height:100%;border-radius:30px;background:#fff;color:#0B0D12;overflow:hidden;display:flex;flex-direction:column;font-family:Figtree,Inter,sans-serif}
.ph-top{padding:40px 16px 14px;background:var(--red);color:#fff}
.ph-top b{display:block;font-size:17px}.ph-top small{opacity:.9;font-size:12px}
.ph-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:11px}
.ph-item{display:flex;gap:10px;align-items:center}
.ph-ic{width:50px;height:50px;border-radius:14px;background:var(--yellow-l);display:grid;place-items:center;flex:none}
.ph-ic svg{width:28px;height:28px;stroke:#A66600;fill:none;stroke-width:1.8;stroke-linejoin:round}
.ph-item b{display:block;font-size:16px}.ph-item span{font-size:12px;color:#A66600;font-weight:700}
.ph-bar{height:10px;border-radius:9px;background:#EDEFF2;position:relative}
.ph-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--warn)}
.ph-bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#000;left:25%}
.ph-qty{display:flex;align-items:center;justify-content:space-between;background:#F4F5F7;border-radius:16px;padding:8px}
.ph-qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:#000;cursor:pointer}
.ph-qty div{text-align:center}.ph-qty b{font-size:28px;display:block;line-height:1.1}.ph-qty small{font-size:11px;color:var(--muted)}
.ph-sup{font-size:12px;color:#374151;line-height:1.7;background:#F4F5F7;border-radius:12px;padding:9px 11px}
.ph-btn{margin-top:auto;padding:14px;border:0;border-radius:14px;background:var(--ok);color:#fff;font:800 17px Figtree,Inter,sans-serif;cursor:pointer}
.ph-note{font-size:10.5px;color:var(--muted);text-align:center}
.ph-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.ph-done .okc{width:74px;height:74px;border-radius:50%;background:#EDFAF2;display:grid;place-items:center;animation:pop2 .5s cubic-bezier(.2,1.6,.4,1)}
.ph-done svg{width:40px;height:40px;stroke:var(--ok);stroke-width:3;fill:none}
.ph-done b{font-size:18px}.ph-done span{font-size:12px;color:var(--muted)}
@keyframes pop2{from{transform:scale(.3)}}
/* map objects */
path.store{transition:opacity .4s}
path.pop{animation:fadein .7s both}
@keyframes fadein{from{opacity:0}}
#map.dim path.store{opacity:.12}
#map.dim path.store.hl{opacity:1}
#map.dim .terr{opacity:.25}
path.flow{stroke-dasharray:3 8;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.pulse{border-radius:50%;position:relative}
.pulse:before,.pulse:after{content:'';position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--c);opacity:0;animation:ring 2s ease-out infinite}
.pulse:after{animation-delay:1s}
@keyframes ring{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.truck{width:100%;height:100%;border-radius:50%;background:var(--c);border:1.5px solid #000;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.truck.cold{animation:coldblink .8s steps(2) infinite}
@keyframes coldblink{50%{opacity:.35}}
.selr{width:100%;height:100%;border-radius:50%;border:2.5px solid #000;background:rgba(255,202,26,.35)}
.dc{position:relative;width:26px;height:26px}
.dc-core{position:absolute;inset:0;border-radius:8px;background:#000;border:2px solid var(--yellow);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.dc-t{position:absolute;inset:0;display:grid;place-items:center;font:800 9px Figtree,Inter,sans-serif;color:var(--yellow)}
.dc-label{position:absolute;left:33px;top:0;white-space:nowrap;font-size:12.5px;font-weight:800;color:#000;text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 9px #fff}
.dc-label small{display:block;font:700 9.5px Figtree,Inter,sans-serif;color:#6B7280;letter-spacing:.08em}
.cpill{display:inline-block;transform:translate(0,-100%);padding:2px 7px;border-radius:999px;background:#000;color:#fff;font:800 10.5px Figtree,Inter,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.sup{width:12px;height:12px;transform:rotate(45deg);background:var(--c);border:1.8px solid #242933}
.heat{border-radius:50%;background:radial-gradient(circle,rgba(207,58,53,.5),rgba(247,173,40,.22) 40%,transparent 70%);mix-blend-mode:multiply}
.newsite{width:100%;height:100%;border-radius:50%;border:3px solid var(--info);background:rgba(0,82,204,.12)}
.money{white-space:nowrap;padding:6px 10px;border-radius:9px;background:#fff;border:1.5px solid var(--warn);color:#000;font:800 12.5px Figtree,Inter,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.14);transform:translate(-50%,-50%);display:inline-block;animation:fadein .6s both;text-align:center}
.money small{display:block;color:var(--muted);font-weight:600;font-size:10px}
.money.bad{border-color:var(--danger);color:var(--danger)}
.money.ok{border-color:var(--ok);color:var(--ok)}
.leaflet-tooltip.tt{background:#fff;color:#000;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.14);font:600 12px Figtree,Inter,sans-serif;padding:7px 10px}
.leaflet-tooltip.tt span{color:var(--muted);font-size:11px;font-weight:500}
.leaflet-tooltip-top.tt:before{border-top-color:#fff}
.leaflet-tooltip.terr-label{background:transparent;border:0;box-shadow:none;color:#111;font:800 12.5px Figtree,Inter,sans-serif;text-align:center;text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 9px #fff;line-height:1.35}
.leaflet-tooltip.terr-label small{display:block;font:700 10px Figtree,Inter,sans-serif;letter-spacing:.08em;color:#4B5563;text-transform:uppercase}
.terr-label:before{display:none}
#map.dim .terr-label{opacity:.25!important}
#map.hide-terr .terr-label{display:none}
#map.hide-terr .cpill{display:none}
.leaflet-container{font-family:Figtree,Inter,sans-serif}
.leaflet-bottom.leaflet-right{bottom:54px;right:400px}
.leaflet-control-attribution{background:rgba(255,255,255,.8)!important;color:#6B7280!important;font-size:9.5px}
.leaflet-control-attribution a{color:#374151!important}
@media (max-width:1300px){.phone{display:none}.client small{display:none}}
@media (max-width:1000px){.left{display:none}.right{width:auto;left:14px;top:auto;height:44%}.client,.sep,.badge{display:none}.leaflet-bottom.leaflet-right{right:14px}}

$('#tk').innerHTML=(EV.map(e=>`<span>${e}</span>`).join('')).repeat(2);
const clk=()=>$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Riyadh'})+' AST';clk();setInterval(clk,1000);

// ---------- panels ----------
const panel=$('#panel');
function home(){
 LY.sel.clearLayers();
 const lic=LIC.map(l=>`<div class="prog li click" style="display:block" onclick="selectLic(LK.${l.id})"><div class="pl"><span class="swt" style="background:${l.color}"></span>${l.en}<b>${l.n}</b></div><div class="bar"><i style="width:${l.n/stores.length*100}%;background:${l.color};color:${l.color}"></i></div><div class="pn">${l.regions.map(r=>r.en).join(' + ')} · ${l.erpOn?'<span style="color:var(--ok)">Dynamics 365 connected</span>':'<span style="color:var(--warn)">Excel & WhatsApp today</span>'}</div></div>`).join('');
 const al=alerts.map(a=>`<div class="li click" onclick="${a.go}"><div class="l2"><span class="bul" style="--c:${a.lvl==='bad'?'var(--danger)':'var(--warn)'}"></span><div><b>${a.t}</b><span>${a.s}</span></div></div></div>`).join('');
 const whs=WH.map(w=>`<div class="prog li click" style="display:block" onclick="selectWH(WK.${w.key})"><div class="pl"><span class="swt" style="background:#242933"></span>${w.en}<b>${Math.round(w.util*100)}%</b></div><div class="bar"><i style="width:${w.util*100}%;background:${w.util>.85?'#B20004':'#242933'};color:#242933"></i></div><div class="pn">${w.served} restaurants · ${w.recon?`<span style="color:var(--warn)">${w.recon} lines to reconcile with Dynamics</span>`:'<span style="color:var(--ok)">matches Dynamics</span>'}</div></div>`).join('');
 panel.innerHTML=`<div class="eyebrow">Licensor view · BFS</div><h2>One map of every licensee, restaurant, warehouse and supplier</h2><div class="sub">${stores.length} restaurants · ${LIC.length} licensees · ${WH.length} warehouses · ${SUP.length} approved suppliers</div>
 <h4>Licensees</h4>${lic}
 <h4>Needs attention <span class="cnt">${alerts.length}</span></h4>${al}
 <h4>Warehouses</h4>${whs}
 <h4>How Penny fits</h4><div class="card"><div class="ct">Dynamics stays the backbone</div>Restaurants order in Penny. Items, vendors, prices and warehouses come from Dynamics 365, and every PO, receipt and invoice goes back to it. Nobody keys the same order twice or closes the month twice.</div>
 <div class="steps"><div class="step">Phase 1 · Direct supply<span>Restaurants order from BFS-approved suppliers at contract prices</span></div><div class="step">Phase 2 · Three-way<span>Restaurant ↔ warehouse ↔ supplier with 3PL tracking and suggested reorders</span></div></div>`}

function selRing(c){LY.sel.clearLayers();L.marker(c,{icon:L.divIcon({className:'',html:'<div class="selr"></div>',iconSize:[20,20],iconAnchor:[10,10]}),interactive:false}).addTo(LY.sel);pulse(c,'#000000',46,LY.sel)}
function stockRows(s){return s.stock.map(x=>`<div class="stock"><div class="pl">${x.it.en}<b style="color:${x.pct<25?'var(--danger)':'var(--text)'}">${x.qty} ${x.it.unit}</b></div><div class="bar rp"><i style="width:${x.pct}%;background:${x.pct<25?'#B20004':'#242933'};color:${x.pct<25?'#B20004':'#242933'}"></i><em></em></div></div>`).join('')}
function selectStore(s){
 selRing(s.c);if(map.getZoom()<10)map.flyTo(s.c,12,{duration:1.2});
 const ctr=CONTRACTS.filter(c=>c.l===s.lic&&(c.v.direct||['no','au','sp'].includes(c.v.k))).slice(0,4);
 const car=s.id%3===0?CARRIER.tpl:CARRIER.own;
 panel.innerHTML=`<div class="ph"><div class="dot" style="--c:${s.lic.color}"></div><div><div class="eyebrow">${s.lic.en}</div><h2>${s.en}</h2><div class="sub">${s.city.en} · ${s.cls.en} restaurant · supplied by ${s.wh.en}</div></div></div>
 <div class="row3"><div class="ring" style="--p:${s.health};--c:${s.health<100?'var(--warn)':'var(--ok)'}"><div><b>${s.health}%</b><span>stock ok</span></div></div>
 <div class="stat"><span>Sales today (POS)</span><b>SAR ${fmt(s.sales)}</b></div><div class="stat"><span>Orders this month</span><b>${s.orders}</b></div></div>
 <h4>Stock on hand <span style="text-transform:none;letter-spacing:0">· white tick = reorder point</span></h4>${stockRows(s)}
 <div class="card"><div class="ct">Last delivery</div>${car.en} · GRN-${40000+s.id*7} · <b style="color:var(--ok)">geofence verified</b> · ${s.temp.toFixed(1)}°C on receipt · synced to Dynamics</div>
 <h4>Supply contracts that apply</h4>${ctr.map(c=>`<div class="li"><div><b>${c.v.en} <span>· ${c.v.cat}</span></b><span>${c.basis} · ${c.win} · ${c.pay}</span></div>${tag(c.d)}</div>`).join('')}
 ${s.low.length?`<button class="btn" onclick="reorder(stores[${s.id}])">Reorder ${s.low.length} low item${s.low.length>1?'s':''} in one tap</button>`:''}`}

function selectWH(w){
 selRing(w.c);map.flyTo(w.c,Math.max(map.getZoom(),8),{duration:1});
 const sup=SUP.filter(v=>v.to&&v.to.includes(w.key));
 panel.innerHTML=`<div class="eyebrow">Warehouse</div><h2>${w.en}</h2><div class="sub">${w.cap} · serves ${w.served} restaurants</div>
 <div class="row3"><div class="ring big" style="--p:${Math.round(w.util*100)};--c:${w.util>.85?'var(--danger)':'#242933'}"><div><b>${Math.round(w.util*100)}%</b><span>utilized</span></div></div>
 <div style="flex:1;display:grid;gap:8px"><div class="stat"><span>Shipments today</span><b>${stores.filter(s=>s.wh===w&&s.id%3!==0).length}</b></div><div class="stat"><span>Stock cover</span><b>${RI(9,16)} days</b></div></div></div>
 <div class="card ${w.recon?'':'ok'}"><div class="ct">Month-end vs Dynamics 365</div>${w.recon?`<b>${w.recon} stock lines</b> don't match Dynamics. Penny lists them now, so month-end closing isn't done twice.`:'All stock lines match Dynamics. Nothing to reconcile.'}</div>
 <h4>Cold rooms</h4><div class="grid2" style="margin-top:0"><div class="stat"><span>Chiller</span><b>${R(1.8,3.4).toFixed(1)}°C</b></div><div class="stat"><span>Freezer</span><b>−${R(18,21).toFixed(1)}°C</b></div></div>
 <h4>Inbound suppliers</h4>${sup.map(v=>`<div class="li click" onclick="selectSupplier(SK.${v.k})"><div><b>${v.en}</b><span>${v.cat} · ${Math.round(km(v.c,w.c))} km</span></div><span class="tag ${v.ot>=94?'ok':'warn'}">${v.ot}% on time</span></div>`).join('')}
 <button class="btn" onclick="shipments('${w.key}')">Show today's shipments from here</button>`}

function selectSupplier(v){
 selRing(v.c);map.flyTo(v.c,Math.max(map.getZoom(),7),{duration:1});
 const pk=Object.keys(PRICES).find(k=>PRICES[k].sup===v.k),pr=pk&&PRICES[pk];
 panel.innerHTML=`<div class="eyebrow">Approved supplier · ${v.cat}</div><h2>${v.en}</h2><div class="sub">${v.direct?'delivers direct to restaurants':'delivers to '+v.to.map(k=>WK[k].en).join(', ')}</div>
 <div class="grid2"><div class="stat"><span>On-time delivery</span><b>${v.ot}%</b></div><div class="stat"><span>Spend YTD, all licensees</span><b>SAR ${fmt(v.spend)}</b></div><div class="stat"><span>Open POs</span><b>${v.pos}</b></div><div class="stat"><span>Licensees served</span><b>${CONTRACTS.filter(c=>c.v===v).length}</b></div></div>
 ${pr?`<h4>Price by licensee · ${IK[pk].en} (${pr.unit})</h4>${LIC.map(l=>{const vv=(pr.p[l.id]-pr.rec)/pr.rec*100;return `<div class="li"><div class="l2"><span class="bul" style="--c:${l.color}"></span><div><b>${l.en}</b><span>SAR ${pr.p[l.id]} · recommended ${pr.rec}</span></div></div>${pctTag(vv)}</div>`}).join('')}`:''}
 <h4>Certificates</h4>${[['Halal certificate',v.halal],['SFDA registration',v.sfda]].map(([t,d])=>`<div class="li"><div><b>${t}</b><span>${d<30?'new POs blocked on expiry':'valid'}</span></div>${tag(d)}</div>`).join('')}
 <div class="card"><div class="ct">Rule</div>Nothing reaches a restaurant unless BFS approved the supplier and the item. Licensees can renegotiate, and every line price stays visible to BFS.</div>`}

function selectLic(l){
 LY.sel.clearLayers();map.flyToBounds(L.latLngBounds(l.regions.flatMap(r=>r.poly)),{...pad(),duration:1.1});
 const net=l.stores.reduce((a,s)=>a+s.sales*30,0),cls=CLASSES.map(c=>`<div class="stat"><span>${c.en}</span><b>${l.stores.filter(s=>s.cls===c).length}</b></div>`).join('');
 const pf=priceFlags.filter(f=>f.l===l),ce=CONTRACTS.filter(c=>c.l===l&&c.d<60),po=PREOPEN.filter(p=>p.lic===l.id);
 panel.innerHTML=`<div class="ph"><div class="dot" style="--c:${l.color}"></div><div><div class="eyebrow">Licensee · since ${l.since}</div><h2>${l.en}</h2><div class="sub">${l.regions.map(r=>r.en).join(' + ')}</div></div></div>
 <div class="row3"><div class="ring big" style="--p:${Math.round(l.n/stores.length*100)};--c:${l.color}"><div><b>${l.n}</b><span>restaurants</span></div></div>
 <div style="flex:1;display:grid;gap:8px"><div class="stat"><span>Net sales, month (POS)</span><b>SAR ${fmt(net)}</b></div><div class="stat"><span>Royalty at ${RATE}%</span><b>SAR ${fmt(net*RATE/100)}</b></div></div></div>
 <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">${cls}</div>
 <h4>Systems</h4><div class="li"><div><b>${l.erp}</b><span>${l.erpOn?'Orders, receipts and invoices sync both ways':'Orders arrive by WhatsApp and Excel today'}</span></div><span class="tag ${l.erpOn?'ok':'warn'}">${l.erpOn?'connected':'phase 2'}</span></div>
 <h4>Governance</h4>
 <div class="li click" onclick="priceGov('${pf[0]?.k||'oil'}')"><div><b>Price flags</b><span>lines above BFS recommended price</span></div><span class="tag ${pf.length?'warn':'ok'}">${pf.length}</span></div>
 <div class="li click" onclick="contracts()"><div><b>Supply contracts expiring ≤ 60 days</b><span>routed to Legal</span></div><span class="tag ${ce.length?'warn':'ok'}">${ce.length}</span></div>
 <div class="li click" onclick="reorder()"><div><b>Restaurants below reorder point</b><span>suggested orders waiting</span></div><span class="tag ${l.stores.filter(s=>s.low.length).length?'warn':'ok'}">${l.stores.filter(s=>s.low.length).length}</span></div>
 <div class="li click" onclick="preopen()"><div><b>Pre-opening sites</b><span>royalty starts at actual opening</span></div><span class="tag info">${po.length}</span></div>`}

// ---------- scenarios ----------
let timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
function clearScenario(){timers.forEach(clearTimeout);timers=[];LY.scen.clearLayers();for(let k=movers.length-1;k>=0;k--)if(movers[k].layer===LY.scen)movers.splice(k,1);
 mapEl.classList.remove('dim','hide-terr');stores.forEach(s=>s.m.getElement()?.classList.remove('hl'));LY.sel.clearLayers();$('#phone').classList.remove('show')}
function hl(list){mapEl.classList.add('dim');list.forEach(s=>s.m.getElement()?.classList.add('hl'))}
function resetAll(){clearScenario();setActive(null);home();map.flyToBounds(allBounds,{...pad(),duration:1.4})}

function shipments(k){
 clearScenario();setActive('ship');const w=WK[k];
 const REASON=['Traffic on the ring road','Loading queue at the warehouse','Missed the receiving window','Vehicle swap, replacement sent'];
 const st=stores.filter(s=>s.wh===w&&s.id%3!==0).map(s=>{const h=(s.id*37)%20;return{s,status:h<11?'done':h<18?'transit':'late',car:s.id%4===0?CARRIER.tpl:CARRIER.own,why:REASON[s.id%4]}});
 hl(st.map(x=>x.s));pulse(w.c,'#242933',70);
 st.forEach((x,i)=>later(()=>{const pts=arc(w.c,x.s.c,.18,40),col=x.status==='done'?'#006626':x.status==='transit'?'#242933':'#CC7E00';
  line(pts,col,LY.scen,{w:x.status==='late'?1.8:1.1,op:.75,flow:x.status!=='done',halo:x.status==='late'});
  if(x.status==='transit')addMover(pts,{color:'#FFCA1A',speed:R(.08,.16),t:rnd()*.8,layer:LY.scen,size:8});
  if(x.status==='late')pulse(x.s.c,'#CC7E00',28)},i*22));
 map.flyToBounds(L.latLngBounds([w.c,...st.map(x=>x.s.c)]),{...pad(),duration:1.2,maxZoom:10});
 const n=t=>st.filter(x=>x.status===t).length,late=st.filter(x=>x.status==='late');
 panel.innerHTML=`<div class="eyebrow">Shipments today</div><h2>${w.en}</h2><div class="sub">${st.length} restaurant drops · live from 3PL and own fleet</div>
 <div class="seg">${WH.map(x=>`<button class="${x===w?'on':''}" onclick="shipments('${x.key}')">${x.en.replace(' Warehouse','')}</button>`).join('')}</div>
 <div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><div class="stat"><span>Delivered</span><b style="color:var(--ok)">${n('done')}</b></div><div class="stat"><span>In transit</span><b style="color:var(--accent)">${n('transit')}</b></div><div class="stat"><span>Delayed</span><b style="color:var(--warn)">${n('late')}</b></div></div>
 <div class="grid2"><div class="stat"><span>${CARRIER.own.en}</span><b>${st.filter(x=>x.car===CARRIER.own).length} drops</b></div><div class="stat"><span>Al Masar (3PL)</span><b>${st.filter(x=>x.car===CARRIER.tpl).length} drops</b></div></div>
 <h4>Delayed</h4>${late.map(x=>`<div class="li click" onclick="selectStore(stores[${x.s.id}])"><div><b>${x.s.en}</b><span>${x.why} · ${x.car.en}</span></div><span class="tag warn">+${20+(x.s.id%5)*15} min</span></div>`).join('')||'<div class="sub">No delays</div>'}
 <div class="card"><div class="ct">SLA approach</div>Delays are tracked and reported to BFS and the licensee. They're not penalized automatically, because some causes are outside anyone's control.</div>`}

const SHIRT='<svg viewBox="0 0 24 24"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg>';
const BOX='<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>';
let phoneState=null;
function showPhone(s,x){
 const qty=Math.max(1,Math.round((.8-x.pct/100)*x.it.cap)),v=SK[x.it.sup],pr=PRICES[x.it.k];
 phoneState={s,x,qty,v};
 $('#scr').innerHTML=`<div class="ph-top"><b>${s.en}</b><small>Suggested order · ${s.lic.en}</small></div>
 <div class="ph-body"><div class="ph-item"><div class="ph-ic">${x.it.k==='uni'?SHIRT:BOX}</div><div><b>${x.it.en}</b><span>${x.qty} ${x.it.unit} left · below reorder point</span></div></div>
 <div class="ph-bar"><i style="width:${x.pct}%"></i><em></em></div>
 <div class="ph-qty"><button onclick="phoneQty(-1)">−</button><div><b id="pq">${qty}</b><small>suggested quantity</small></div><button onclick="phoneQty(1)">+</button></div>
 <div class="ph-sup">Approved supplier: <b>${v.en}</b><br>${pr?`Agreed price: SAR ${pr.p[s.lic.id]}`:'Price as per contract'} · delivery in 3 days</div>
 <button class="ph-btn" onclick="phoneApprove()">Approve</button><div class="ph-note">Creates the PO in Penny and sends it to Dynamics</div></div>`;
 $('#phone').classList.add('show')}
function phoneQty(d){phoneState.qty=Math.max(1,phoneState.qty+d*(phoneState.x.it.cap>=100?10:1));$('#pq').textContent=phoneState.qty}
function phoneApprove(){const p=phoneState,po='PO-'+(88200+p.s.id);
 $('#scr').innerHTML=`<div class="ph-top"><b>${p.s.en}</b><small>Suggested order</small></div><div class="ph-done"><div class="okc"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><b>Order sent</b><span>${p.qty} ${p.x.it.unit} · ${p.v.en}</span><span class="mono">${po}</span></div>`;
 toast(`${po} created in Penny · synced to Dynamics 365 · ${p.v.en} notified`);
 const pts=arc(p.v.c,p.s.c,.2,50);line(pts,'#006626',LY.scen,{w:2.4});addMover(pts,{color:'#006626',speed:.25,layer:LY.scen,size:11})}
function reorder(s){
 clearScenario();setActive('reorder');
 const low=[];stores.forEach(st=>st.low.forEach(x=>low.push({s:st,x})));low.sort((a,b)=>a.x.pct-b.x.pct);
 hl(lowStores);lowStores.forEach(x=>pulse(x.c,'#CC7E00',30));
 const focus=s?{s,x:s.stock.slice().sort((a,b)=>a.pct-b.pct)[0]}:{s:demoLow,x:demoLow.stock[5]};
 selRing(focus.s.c);
 const pb=innerWidth>1300?{...pad(),paddingBottomRight:[690,66]}:pad();
 if(s)map.flyTo(s.c,11,{duration:1.1});else map.flyToBounds(L.latLngBounds(lowStores.map(x=>x.c)),{...pb,duration:1.2});
 later(()=>showPhone(focus.s,focus.x),700);
 panel.innerHTML=`<div class="eyebrow" style="color:var(--warn)">Low stock · suggested orders</div><h2>${low.length} items below reorder point</h2><div class="sub">across ${lowStores.length} restaurants · reorder point is 25% of par, set per item</div>
 <div class="card"><div class="ct">How it works</div>Penny watches stock against each restaurant's sales history. When an item drops under the reorder point it <b>suggests</b> an order from the BFS-approved supplier at the contract price. The manager approves with one tap. Nothing is ordered automatically.</div>
 <h4>Lowest first</h4>${low.slice(0,24).map(r=>`<div class="li click" onclick="reorder(stores[${r.s.id}])"><div class="l2"><span class="bul" style="--c:${r.s.lic.color}"></span><div><b>${r.x.it.en} <span>· ${r.x.qty} ${r.x.it.unit} left</span></b><span>${r.s.en} · ${r.s.city.en}</span></div></div><span class="tag ${r.x.pct<15?'bad':'warn'}">${r.x.pct}%</span></div>`).join('')}`}

function abnormal(){
 clearScenario();setActive('abn');hl(ABN.map(a=>a.s));
 ABN.forEach((a,i)=>later(()=>{pulse(a.s.c,'#B20004',58);const v=SK[IK[a.it].sup];line(arc(v.c,a.s.c,.2,50),'#B20004',LY.scen,{w:1.8})},i*300));
 map.flyToBounds(L.latLngBounds(ABN.flatMap(a=>[a.s.c,SK[IK[a.it].sup].c])),{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow" style="color:var(--danger)">Abnormal orders</div><h2>${ABN.length} orders need a second look</h2><div class="sub">Every order is checked against POS sales, stock on hand and what's already in transit</div>
 ${ABN.map(a=>`<div class="card bad"><div class="ct">${a.t}</div><b>${a.s.en}</b> · ${a.s.lic.en}<br>${a.d}<div class="nums">${a.type==='dup'?'<div><b>20</b>on hand</div><div><b>100</b>in transit</div><div><b>100</b>ordered</div>':a.type==='resale'?'<div><b>42</b>tins bought</div><div><b>~15</b>POS supports</div><div><b>2.7×</b>ratio</div>':'<div><b>+64%</b>vs average</div><div><b>0%</b>sales change</div><div><b>3</b>days</div>'}</div><button class="btn sm" onclick="selectStore(stores[${a.s.id}])">${a.act} · open restaurant</button></div>`).join('')}`}

function priceGov(k){
 clearScenario();setActive('price');mapEl.classList.add('hide-terr');const p=PRICES[k],v=SK[p.sup],it=IK[k];
 REG.forEach(r=>{const l=LK[r.lic],vv=(p.p[l.id]-p.rec)/p.rec*100,col=vv>5?'#B20004':vv>2?'#CC7E00':'#006626';
  L.polygon(r.poly,{color:col,weight:2,opacity:.9,fillColor:col,fillOpacity:.16,interactive:false}).addTo(LY.scen);
  label(r.center,`SAR ${p.p[l.id]}<small>${vv>0?'+':''}${vv.toFixed(1)}% · ${l.en}</small>`,vv>5?'bad':vv>2?'':'ok');
  later(()=>line(arc(v.c,r.center,.2,50),col,LY.scen,{w:1.4,op:.7}),300)});
 pulse(v.c,'#CC7E00',50);map.flyToBounds(allBounds,{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow">Price governance</div><h2>${it.en}</h2><div class="sub">${v.en} · BFS recommended price SAR ${p.rec} ${p.unit}</div>
 <div class="seg">${Object.keys(PRICES).map(x=>`<button class="${x===k?'on':''}" onclick="priceGov('${x}')">${IK[x].en.replace(' 18 L','').replace('Staff ','').replace('Packaging ','')}</button>`).join('')}</div>
 <h4>What each licensee pays</h4>${LIC.map(l=>{const vv=(p.p[l.id]-p.rec)/p.rec*100;return `<div class="prog"><div class="pl"><span class="swt" style="background:${l.color}"></span>${l.en}<b>SAR ${p.p[l.id]}</b></div><div class="bar"><i style="width:${Math.min(100,p.p[l.id]/(p.rec*1.12)*100)}%;background:${vv>5?'#B20004':vv>2?'#CC7E00':'#006626'};color:${vv>5?'#B20004':'#006626'}"></i></div><div class="pn">${vv>0?'+':''}${vv.toFixed(1)}% vs recommended</div></div>`}).join('')}
 <div class="card"><div class="ct">Why this matters</div>Licensees can renegotiate with suppliers, which is fine. What BFS couldn't see was <b>one supplier charging different licensees different prices</b> for the same line. Penny tracks every line price on every PO.</div>
 <button class="btn" onclick="toast('Price alignment request sent to ${v.en} · licensees copied')">Ask the supplier to align prices</button>`}

function royalties(){
 clearScenario();setActive('roy');mapEl.classList.add('hide-terr');map.flyToBounds(allBounds,{...pad(),duration:1.2});
 const ST=['Paid','Paid','Issued','Issued'];
 const rows=LIC.map((l,i)=>{const net=l.stores.reduce((a,s)=>a+s.sales*31*.93,0);return{l,net,roy:net*RATE/100,st:ST[i]}});
 const tot=rows.reduce((a,r)=>a+r.roy,0),max=Math.max(...rows.map(r=>r.roy));
 rows.forEach((r,i)=>r.l.regions.forEach((g,j)=>later(()=>{pulse(g.center,'#CC7E00',70);label(g.center,`SAR ${fmt(r.roy*g.n/r.l.n)}<small>${g.en} · ${r.st}</small>`)},(i*2+j)*220)));
 panel.innerHTML=`<div class="eyebrow">Royalty invoices · August 2026</div><h2>SAR ${fmt(tot)} invoiced to ${LIC.length} licensees</h2><div class="sub">Same rate for every licensee (${RATE}%, demo figure) · calculated in Dynamics, shown here</div>
 <h4>Daily pipeline</h4><div class="steps"><div class="step">POS day close · 02:45<span>${stores.length} restaurants</span></div><div class="step">Push to Azure · 11:00<span>automatic batch job</span></div><div class="step">Dynamics 365 calculates<span>royalty per licensee, per month</span></div><div class="step">Invoice issued<span>no manual calculation</span></div></div>
 <h4>By licensee</h4>${rows.map(r=>`<div class="prog"><div class="pl"><span class="swt" style="background:${r.l.color}"></span>${r.l.en}<b>SAR ${fmt(r.roy)}</b></div><div class="bar"><i style="width:${r.roy/max*100}%;background:${r.l.color};color:${r.l.color}"></i></div><div class="pn">${r.l.n} restaurants · net sales SAR ${fmt(r.net)} · <span style="color:${r.st==='Paid'?'var(--ok)':'var(--warn)'}">${r.st}</span></div></div>`).join('')}
 <div class="card"><div class="ct">What Penny adds</div>The licensee sees the same numbers BFS sees, down to restaurant and day. The ${PREOPEN.length} pre-opening sites are excluded until they actually open.</div>`}

function contracts(){
 clearScenario();setActive('ctr');
 const ex=CONTRACTS.filter(c=>c.d<60).sort((a,b)=>a.d-b.d);
 ex.forEach((c,i)=>later(()=>{pulse(c.v.c,c.d<30?'#B20004':'#CC7E00',44);c.l.regions.forEach(r=>line(arc(c.v.c,r.center,.2,50),c.d<30?'#B20004':'#CC7E00',LY.scen,{w:1.3,op:.7}))},i*200));
 map.flyToBounds(allBounds,{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow" style="color:var(--warn)">Contract renewals</div><h2>${ex.length} supply contracts expire in 60 days</h2><div class="sub">Direct supply terms: price, delivery window and payment terms agreed in advance</div>
 <h4>Soonest first</h4>${ex.map(c=>`<div class="li"><div class="l2"><span class="bul" style="--c:${c.l.color}"></span><div><b>${c.v.en} × ${c.l.en}</b><span>${c.basis} · ${c.win} · ${c.pay}</span></div></div>${tag(c.d)}</div>`).join('')}
 <button class="btn" onclick="toast('${ex.length} renewals routed to Legal (CLM) with the current terms attached')">Route ${ex.length} renewals to Legal</button>
 <div class="card"><div class="ct">Next step: framework agreements</div>No MFAs are active today. When BFS introduces them, each can carry a spend cap by quantity or by price, and Penny stops orders that would breach it.</div>`}

function preopen(){
 clearScenario();setActive('pre');
 PREOPEN.forEach((p,i)=>later(()=>{const w=WH.reduce((a,x)=>km(x.c,p.c)<km(a.c,p.c)?x:a);
  L.marker(p.c,{icon:L.divIcon({className:'',html:'<div class="newsite"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(LY.scen);
  pulse(p.c,p.slip?'#CC7E00':'#0052CC',56);line(arc(w.c,p.c,.2,40),'#0052CC',LY.scen,{w:1.2,op:.6})},i*250));
 map.flyToBounds(L.latLngBounds(PREOPEN.map(p=>p.c)),{...pad(),duration:1.2});
 panel.innerHTML=`<div class="eyebrow">Pre-opening sites</div><h2>${PREOPEN.length} restaurants getting ready to open</h2><div class="sub">Handled by the licensee's engineering team and consultants</div>
 <h4>Sites</h4>${PREOPEN.map(p=>`<div class="li"><div class="l2"><span class="bul" style="--c:${LK[p.lic].color}"></span><div><b>${p.en} <span>· ${p.city}</span></b><span>${p.st} · ${p.why}</span></div></div><span class="tag ${p.slip?'warn':'ok'}">${p.slip?p.exp+' → '+p.now:p.now}</span></div>`).join('')}
 <div class="card"><div class="ct">How delays are handled</div>Openings slip for real reasons: pipes, air conditioning, cold rooms. Penny tracks the dates and reasons for BFS without penalties, and royalty starts from the actual opening date.</div>
 <div class="card"><div class="ct">Before launch</div>When a site is ready, the supply chain team confirms the date and Penny notifies every approved supplier so the first delivery arrives on time.</div>`}

function flyTruck(id){clearScenario();setActive(null);const t=inTransit.find(x=>x.id===id),p=t.mv.m.getLatLng();map.flyTo(p,9,{duration:1.2});
 panel.innerHTML=`<div class="eyebrow" style="color:var(--danger)">Cold chain</div><h2>Truck ${t.id} at ${t.temp.toFixed(1)}°C</h2><div class="sub">${t.car.en} · ${t.s.wh.en} → ${t.s.en}</div>
 <div class="grid2"><div class="stat"><span>Limit</span><b>5.0°C</b></div><div class="stat"><span>Above limit for</span><b style="color:var(--danger)">${RI(14,40)} min</b></div></div>
 <div class="card"><div class="ct">Automatic action</div>Receipt at the restaurant is on hold. The manager sees a warning on the receiving screen and records a temperature before accepting.</div>`}

home();
</script>
</body>
</html>
